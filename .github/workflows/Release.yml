name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v0.4.5)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage + deb)
            platform: ubuntu-22.04
            args: "--bundles appimage,deb"
            upload_plain_binary: false
            asset_name: "OPP_[version]_linux_[arch][ext]"
          - name: Windows (portable exe)
            platform: windows-latest
            kind: portable
            args: "--no-bundle"
            upload_plain_binary: true
            asset_name: "OPP_[version]_windows_[arch]_portable[ext]"
          - name: Windows (NSIS installer)
            platform: windows-latest
            kind: nsis
            args: "--bundles nsis"
            upload_plain_binary: false
            asset_name: "OPP_[version]_windows_[arch]_setup[ext]"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "OPP ${{ env.RELEASE_TAG }}"
          releaseBody: "Download AppImage or deb for Linux, or the NSIS installer / portable exe for Windows."
          # 所有平台和 latest.json 上传完成后再发布，避免固定地址指向半成品。
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
          uploadPlainBinary: ${{ matrix.upload_plain_binary }}
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          workflowArtifactNamePattern: "OPP-[version]-[platform]-[arch]-[bundle]"
          retryAttempts: 3

      - name: Create and upload portable update manifest
        if: matrix.platform == 'windows-latest' && matrix.kind == 'portable'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:RELEASE_TAG -replace '^[vV]', ''
          $assetNames = gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name'
          $portableAssets = @($assetNames | Where-Object { $_ -like 'OPP_*_windows_*_portable.exe' })
          if ($portableAssets.Count -ne 1) {
            throw "Expected exactly one Windows portable EXE, found $($portableAssets.Count)."
          }
          $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($portableAssets[0])"
          # 固定清单只保存客户端实际需要的版本号和便携 EXE 地址。
          [ordered]@{ version = $version; url = $assetUrl } |
            ConvertTo-Json |
            Set-Content -Path "latest.json" -Encoding utf8
          gh release upload $env:RELEASE_TAG "latest.json" --clobber

  publish-release:
    name: Publish complete release
    needs: build-and-release
    runs-on: ubuntu-22.04
    steps:
      - name: Publish draft after every asset succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
