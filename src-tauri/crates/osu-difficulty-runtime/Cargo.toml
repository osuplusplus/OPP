[package]
name = "osu-difficulty-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only runtime compatibility layer for OPP beatmap similarity"

[dependencies]
anyhow = "1"
bincode = "1.3"
hex = "0.4"
hnsw = { version = "0.11", features = ["serde1"] }
memmap2 = "0.9"
rand_pcg = { version = "0.3", features = ["serde1"] }
rosu-pp = { git = "https://github.com/Apeuriox/rosu-pp", rev = "9a073d29611ef936b581a08d3c5b288ef5427301" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
space = { version = "0.17", features = ["alloc", "serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
