[package]
name = "osu-difficulty-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only runtime compatibility layer for OPP beatmap similarity"

[dependencies]
anyhow = "1"
bincode = "1.3"
hex = "0.4"
hnsw = { version = "0.11", features = ["serde1"] }
mania-pattern = { git = "https://github.com/inferior0909/osu-difficulty-lab", rev = "f681bc460a9a473f10c17f6bb89754396ff5e6a4", package = "mania-pattern" }
memmap2 = "0.9"
rand_pcg = { version = "0.3", features = ["serde1"] }
rosu-pp = { git = "https://github.com/Apeuriox/rosu-pp.git", branch = "pp-rework-202607" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
space = { version = "0.17", features = ["alloc", "serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
