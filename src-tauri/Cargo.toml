[package]
name = "opp"
version = "0.4.5"
description = "An all-in-one osu! toolkit"
authors = ["l1rics"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
realm-db-reader = { git = "https://github.com/Ohdmire/realm-db-reader" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
axum = "0.8"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
flate2 = "1"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
chardetng = "0.1"
encoding_rs = "0.8"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
rayon = "1"
rosu-map = "0.2.1"
# pp-rework-202607(改动已合入上游;Cargo.lock 钉住具体 rev,分支移动
# 不影响可复现构建)。
rosu-pp = { git = "https://github.com/Apeuriox/rosu-pp.git", branch = "pp-rework-202607" }
rosu-pp-official = { package = "rosu-pp", version = "4.0.1" }
sha2 = "0.10"
walkdir = "2"
zip = "4"
rosu-render = "0.5.1"
md-5 = "0.10"
mania-converter = { git = "https://github.com/Siflorite/mania-converter-rust", rev = "5dcfc2205529485c060345b7f04df1c3bf9897ae" }
osu-difficulty-runtime = { path = "crates/osu-difficulty-runtime" }
netease-cloud-music = { path = "crates/netease-cloud-music" }
osu-beatmap-preview = { git = "https://github.com/L1rics06/osu-beatmap-preview", version = "1.0.7" }
osu_replay_render = { git = "https://github.com/Ohdmire/osu-replay-render" }

kira = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_ColorSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader" ] }

[dev-dependencies]
tempfile = "3"

# ── 临时本地 patch(提交前删除本段)──────────────────────────────
# 渲染库未推送的修复(结算屏难度图重建、故事板 ffprobe 注入/视频旋转)
# 经本地 checkout 生效;修复推上远程后删除 [patch] 段即可回到纯远程。
[patch."https://github.com/Ohdmire/osu-replay-render"]
osu_replay_render = { path = "../../osu-replay-render" }
# ────────────────────────────────────────────────────────
